<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Career — Notes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&family=IBM+Plex+Mono:wght@400;500&family=Architects+Daughter&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#ECEAE3}a:hover{color:#FFFFFF}
.bx{position:relative}
.bx::before{content:"";position:absolute;left:-3px;right:-3px;top:0;bottom:0;border-top:1px solid #ECEAE3;border-bottom:1px solid #ECEAE3;pointer-events:none}
.bx::after{content:"";position:absolute;top:-3px;bottom:-3px;left:0;right:0;border-left:1px solid #ECEAE3;border-right:1px solid #ECEAE3;pointer-events:none}
.dim{position:relative;height:0;border-top:1px solid rgba(236,234,227,0.6)}
.dim::before,.dim::after{content:"";position:absolute;top:-5px;height:10px;border-left:1px solid #ECEAE3;transform:skewX(-45deg)}
.dim::before{left:0}.dim::after{right:0}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:rgba(236,234,227,0.6)}
.h2{margin:0;font-weight:500;font-size:12px;letter-spacing:0.24em}
.btn{height:44px;padding:0 16px;background:transparent;border:1px solid rgba(236,234,227,0.5);color:#ECEAE3;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:0.16em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.btn.solid{background:#ECEAE3;color:#0C0C0B;border-color:#ECEAE3}
.nv{text-decoration:none;font-size:11.5px;letter-spacing:0.06em;opacity:0.6;padding:6px 0}
.nv.on{opacity:1;border-bottom:1px solid #ECEAE3}
.hov:hover{background:rgba(236,234,227,0.04)}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; box-sizing: border-box; background: #0C0C0B; color: #ECEAE3; font-family: 'Inter Tight', sans-serif; padding: 40px 56px; display: flex; flex-direction: column; overflow: hidden">
  <nav aria-label="Main" style="display: flex; align-items: center; gap: 17px; height: 28px">
    <span style="font-weight: 500; font-size: 13px; letter-spacing: 0.32em; margin-right: 18px">CAREER</span>
    <a href="#" class="nv">HOME</a>
    <a href="#" class="nv">TIMELINE</a>
    <a href="#" class="nv">SCHEDULE</a>
    <a href="#" class="nv">LEET</a>
    <a href="#" class="nv">COMPANIES</a>
    <a href="#" class="nv">PEOPLE</a>
    <a href="#" class="nv">BOOKS</a>
    <a href="#" class="nv">JOURNAL</a>
    <a href="#" class="nv on" aria-current="page">NOTES</a>
    <a href="#" class="nv">AUDIO</a>
    <a href="#" class="nv">AGENTS</a>
    <label style="margin-left: auto; display: flex; align-items: center; gap: 10px; height: 34px; width: 210px; padding: 0 12px; border: 1px solid rgba(236,234,227,0.35); box-sizing: border-box">
      <svg aria-hidden="true" width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="#ECEAE3" stroke-width="1"><circle cx="6" cy="6" r="4.5"></circle><path d="M9.5 9.5 L13 13"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search everything</span>
      <input type="search" placeholder="Search everything" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #ECEAE3; font: 300 13px 'Inter Tight', sans-serif; outline: none">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; opacity: 0.5">/</span>
    </label>
    <a href="#" aria-label="Settings" style="width: 34px; height: 34px; margin-left: 8px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(236,234,227,0.35)"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#ECEAE3" stroke-width="1"><circle cx="8" cy="8" r="2.5"></circle><path d="M8 1 V3.5 M8 12.5 V15 M1 8 H3.5 M12.5 8 H15 M3 3 L4.8 4.8 M11.2 11.2 L13 13 M3 13 L4.8 11.2 M11.2 4.8 L13 3"></path></svg></a>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-left: 14px">5:20 PM</span>
  </nav>
  <div style="border-top: 1px solid rgba(236,234,227,0.3); margin-top: 12px"></div>
  <header style="display: flex; align-items: flex-end; justify-content: space-between; margin-top: 22px">
    <div style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">21 notes · 10 topics</span><h1 style="margin: 0; font-weight: 200; font-size: 52px; line-height: 0.9">Notes</h1></div>
    <div style="display: flex; gap: 10px"><label style="display: flex; align-items: center; gap: 10px; height: 44px; width: 240px; padding: 0 14px; border: 1px solid rgba(236,234,227,0.5); box-sizing: border-box">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#ECEAE3" stroke-width="1"><circle cx="6" cy="6" r="4.5"></circle><path d="M9.5 9.5 L13 13"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search notes</span>
        <input type="search" placeholder="Search notes" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #ECEAE3; font: 300 13px 'Inter Tight', sans-serif; outline: none">
      </label>
      <button type="button" class="btn solid">+ NEW NOTE</button></div>
  </header>
  <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 48px; margin-top: 30px">
    <nav aria-label="Topics" style="display: flex; flex-direction: column">
      <h2 class="h2" style="margin-bottom: 10px">TOPICS</h2>
      <sc-for list="{{topics}}" as="t" hint-placeholder-count="11"><a href="#" style="{{t.style}}"><span>{{t.name}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; opacity: 0.6">{{t.n}}</span></a></sc-for>
    </nav>
    <section style="display: flex; flex-direction: column; min-width: 0">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px"><h2 class="h2">RECENTLY UPDATED</h2><span class="lbl">All topics</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 150px; gap: 20px 26px; padding: 3px">
        <sc-for list="{{notes}}" as="n" hint-placeholder-count="9">
          <a href="#" class="bx hov" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; min-width: 0">
            <span style="display: flex; justify-content: space-between"><span class="lbl" style="font-size: 9px">{{n.topic}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; opacity: 0.6">{{n.date}}</span></span>
            <span style="font-weight: 300; font-size: 19px; line-height: 1.15; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{n.title}}</span>
            <span style="font-size: 12px; font-weight: 300; opacity: 0.6; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical">{{n.desc}}</span>
            <span style="margin-top: auto; display: flex; justify-content: space-between; align-items: center">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; opacity: 0.6">{{n.words}}</span>
              <sc-if value="{{n.hasTodo}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; gap: 8px"><span style="position: relative; width: 70px; height: 8px"><span style="{{n.fill}}"></span><span class="dim" style="position: absolute; left: 0; right: 0; bottom: 0"></span></span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px">{{n.todo}}</span></span></sc-if>
            </span>
          </a>
        </sc-for>
      </div>
    </section>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const T = [['All',21],['Alloy',1],['Career',1],['Career Strategy',2],['Coffee Chats',4],['Databases',2],['eBPF',3],['General',4],['Interview Prep',1],['Operating systems',2],['Profile',1]];
    const topics = T.map(([name, n], i) => ({ name, n, style: `display:flex;justify-content:space-between;align-items:center;min-height:34px;font-size:14px;font-weight:300;text-decoration:none;${i === 0 ? 'border-left:1px solid #ECEAE3;padding-left:10px;font-weight:400;' : 'opacity:0.75;padding-left:11px;'}` }));
    const N = [
      ['General','Nov 25','Flash Cards to create','',45,0,0],
      ['Interview Prep','Nov 18','AWS SysDE OA — Study Plan','Study plan for the Amazon System Development Engineer online assessment.',1228,18,33],
      ['Profile','Oct 23','Background & Resume Context (for LLMs)','Professional background, resume summary and current Google prep status.',487,0,0],
      ['Operating systems','Oct 12','Add homework assignment for dimensional analysis','',0,0,1],
      ['Coffee Chats','Oct 9','Chat with Marino','',71,0,0],
      ['Coffee Chats','Sep 27','Talk with Devan','',74,0,0],
      ['General','Sep 26','AST','Following config parsing in Alloy.',1485,0,0],
      ['Coffee Chats','Sep 25','Talk with Nicolas A Perez','Notes from my talk with Nicolas Perez.',68,0,0],
      ['Coffee Chats','Sep 22','Talk with Kyle (Datadog)','',96,0,0]
    ];
    const hatch = 'repeating-linear-gradient(-45deg,#ECEAE3 0 0.8px,transparent 0.8px 4px)';
    const notes = N.map(([topic, date, title, desc, words, done, total]) => ({ topic, date, title, desc, words: words + ' words', hasTodo: total > 0, todo: `${done}/${total}`,
      fill: `position:absolute;left:0;bottom:0;height:6px;width:${total ? (done / total) * 100 : 0}%;background:${hatch}` }));
    return { topics, notes };
  }
}
</script>
</body>
</html>
