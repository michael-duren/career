<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — People</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&family=IBM+Plex+Mono:wght@400;500&family=Architects+Daughter&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#ECEAE3}a:hover{color:#FFFFFF}
.bx{position:relative}
.bx::before{content:"";position:absolute;left:-3px;right:-3px;top:0;bottom:0;border-top:1px solid #ECEAE3;border-bottom:1px solid #ECEAE3;pointer-events:none}
.bx::after{content:"";position:absolute;top:-3px;bottom:-3px;left:0;right:0;border-left:1px solid #ECEAE3;border-right:1px solid #ECEAE3;pointer-events:none}
.dim{position:relative;height:0;border-top:1px solid rgba(236,234,227,0.6)}
.dim::before,.dim::after{content:"";position:absolute;top:-5px;height:10px;border-left:1px solid #ECEAE3;transform:skewX(-45deg)}
.dim::before{left:0}.dim::after{right:0}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:rgba(236,234,227,0.6)}
.h2{margin:0;font-weight:500;font-size:11px;letter-spacing:0.24em}
.btn{height:44px;padding:0 14px;background:transparent;border:1px solid rgba(236,234,227,0.5);color:#ECEAE3;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:0.14em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.btn.solid{background:#ECEAE3;color:#0C0C0B;border-color:#ECEAE3}
.srch{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid rgba(236,234,227,0.5);box-sizing:border-box}
.srch input{flex:1;min-width:0;border:0;background:transparent;color:#ECEAE3;font:300 14px 'Inter Tight',sans-serif;outline:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.12em;color:rgba(236,234,227,0.55)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #0C0C0B; color: #ECEAE3; font-family: 'Inter Tight', sans-serif; overflow: hidden">
  <div style="position: absolute; inset: 0 0 78px 0; overflow-y: auto; padding: 22px 22px 28px; box-sizing: border-box; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 24px"><span style="font-weight: 500; font-size: 12px; letter-spacing: 0.32em">CAREER</span><span style="display: flex; align-items: center; gap: 6px"><a href="M-Search.dc.html" aria-label="Search everything" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin: -10px 0"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 14 14" fill="none" stroke="#ECEAE3" stroke-width="1"><circle cx="6" cy="6" r="4.5"></circle><path d="M9.5 9.5 L13 13"></path></svg></a><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">5:20 PM</span></span></div>
    <div style="border-top: 1px solid rgba(236,234,227,0.3); margin-top: 12px"></div>
    <header style="margin-top: 20px; display: flex; flex-direction: column; gap: 6px"><span class="lbl">819 people · 653 employers</span><h1 style="margin: 0; font-weight: 200; font-size: 40px; line-height: 0.9">People</h1></header>
    <div role="tablist" aria-label="View" style="display: grid; grid-template-columns: 1fr 1.3fr 1fr; border: 1px solid rgba(236,234,227,0.5); margin-top: 16px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
    </div>
    <label class="srch" style="margin-top: 10px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#ECEAE3" stroke-width="1"><circle cx="6" cy="6" r="4.5"></circle><path d="M9.5 9.5 L13 13"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search people</span><input type="search" placeholder="{{ph}}"></label>
    <sc-if value="{{isEmp}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; margin-top: 8px">
        <sc-for list="{{cos}}" as="c" hint-placeholder-count="8">
          <div style="display: flex; flex-direction: column; gap: 7px; padding: 10px 0; border-bottom: 1px solid rgba(236,234,227,0.12)">
            <span style="display: flex; justify-content: space-between"><span style="font-weight: 300; font-size: 15px">{{c.name}} <sc-if value="{{c.tracked}}" hint-placeholder-val="{{false}}"><span style="font-size: 9px">◆</span></sc-if></span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">{{c.n}}</span></span>
            <span style="position: relative; height: 8px"><span style="{{c.fill}}"></span><span class="dim" style="{{c.dimStyle}}"></span></span>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{isList}}" hint-placeholder-val="{{true}}">
      <sc-if value="{{isQueue}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px"><span class="lbl" style="font-size: 9px">Q1 referrals · step 2 of 4</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">0 / 2 this week</span></div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 8px"><span style="height: 6px; border: 1px solid #ECEAE3; background: repeating-linear-gradient(-45deg,#ECEAE3 0 0.8px,transparent 0.8px 4px)"></span><span style="height: 6px; border: 1px solid #ECEAE3"></span><span style="height: 6px; border: 1px solid rgba(236,234,227,0.3)"></span><span style="height: 6px; border: 1px solid rgba(236,234,227,0.3)"></span></div>
      </sc-if>
      <div style="display: flex; flex-direction: column; margin-top: 6px">
        <sc-for list="{{rows}}" as="p" hint-placeholder-count="8">
          <sc-if value="{{p.head}}" hint-placeholder-val="{{false}}"><div style="display: flex; justify-content: space-between; align-items: baseline; padding: 18px 0 6px; border-bottom: 1px solid #ECEAE3"><h2 class="h2" style="font-size: 10px">{{p.headName}}</h2><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; opacity: 0.6">{{p.headN}}</span></div></sc-if>
          <sc-if value="{{p.person}}" hint-placeholder-val="{{true}}"><a href="#" style="display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 62px; border-bottom: 1px solid rgba(236,234,227,0.12); text-decoration: none">
            <span style="width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(236,234,227,0.5); display: flex; align-items: center; justify-content: center; font-size: 11px">{{p.initials}}</span>
            <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 300; font-size: 16px">{{p.name}}</span><span style="font-size: 12px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.role}} · {{p.company}}</span></span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; opacity: 0.7">{{p.last}}</span>
          </a></sc-if>
        </sc-for>
      </div>
    </sc-if>
    <button type="button" class="btn" style="margin-top: 20px">IMPORT LINKEDIN EXPORT</button>
  </div>
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 78px; border-top: 1px solid rgba(236,234,227,0.3); background: #0C0C0B; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 16px; box-sizing: border-box">
    <a href="M-Home.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 10 L11 3 L19 10 V19 H3 Z M9 19 V13 H13 V19"></path></svg>HOME</a>
    <a href="M-Timeline.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 5 H12 M6 11 H18 M10 17 H20"></path><path d="M2 3 V7 M12 3 V7 M6 9 V13 M18 9 V13 M10 15 V19 M20 15 V19"></path></svg>TIMELINE</a>
    <a href="M-Schedule.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="4" width="16" height="15"></rect><path d="M3 9 H19 M8.3 4 V19 M13.6 4 V19"></path></svg>SCHEDULE</a>
    <a href="M-Leetgrinder.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M7 6 L2 11 L7 16 M15 6 L20 11 L15 16 M12.5 4 L9.5 18"></path></svg>LEET</a>
    <a href="M-More.dc.html" class="tab" aria-current="page" style="color: #ECEAE3; box-shadow: inset 0 1px 0 #ECEAE3"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 7 H19 M3 11 H19 M3 15 H19"></path></svg>MORE</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 'queue' }; }
  renderVals() {
    const tab = this.state.tab;
    const mk = ([name, role, company, last]) => ({ person: true, head: false, name, role, company, last: last === '—' ? '' : last.toUpperCase(), initials: name.split(' ').filter((w) => w.length > 1).map((w) => w[0]).slice(0, 2).join('') });
    const LANES = [['TO CONTACT',[['Hayden Kotelman','Senior SWE','Grafana Labs','—'],['Joey Brown','Lead MTS','Heroku','—'],['Michael Smith','SWE','Sourcegraph','—'],['Parth Purani','SWE','Snowflake','—'],['Anthony Gacek','SWE','Stripe','—']]],['MESSAGED',[['Paige North','Senior SWE','Microsoft','Sep 11']]],['FOLLOW UP',[['Nicolas A Perez','Senior SWE','Google','Sep 25']]],['REFERRAL ASK',[]]];
    const P = [['Adam Iverson','Software Engineer II','Datasite','—'],['Alex H Stone','Software Engineer 1','Travelers','—'],['Anders Johnson','Principal Engineer','Target','—'],['Brian Holt','Principal TPM','Microsoft','—'],['Bryan Huhta','Senior SWE I','Grafana Labs','—'],['Deepak Kamboj','Senior SWE','Microsoft','—'],['Hayden Kotelman','Senior SWE','Grafana Labs','—'],['Kayla Altepeter','Senior Staff Engineer','Datasite','—']];
    const CO = [['Maximus',20,0],['Travelers',16,0],['Microsoft',9,1],['York Solutions',8,0],['Prime Digital Academy',7,0],['Target',7,0],['Grafana Labs',6,1],['Google',5,1]];
    const hatch = 'repeating-linear-gradient(-45deg,#ECEAE3 0 0.8px,transparent 0.8px 4px)';
    const cos = CO.map(([name, n, t]) => ({ name, n, tracked: !!t, fill: `position:absolute;left:0;bottom:0;height:6px;width:${n * 5}%;background:${t ? '#ECEAE3' : hatch}`, dimStyle: `position:absolute;left:0;bottom:0;width:${n * 5}%` }));
    const tabs = [['people','PEOPLE'],['queue','CATCH-UP · 7'],['emp','EMPLOYERS']].map(([k, label]) => ({ label, sel: k === tab, pick: () => this.setState({ tab: k }),
      style: `height:40px;border:0;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:0.1em;cursor:pointer;${k === tab ? 'background:#ECEAE3;color:#0C0C0B;' : 'background:transparent;color:rgba(236,234,227,0.7);'}` }));
    return { tabs, rows: tab === 'queue' ? LANES.flatMap(([n, ppl]) => [{ head: true, person: false, headName: n, headN: String(ppl.length) }, ...ppl.map(mk)]) : P.map(mk), cos, isEmp: tab === 'emp', isList: tab !== 'emp', isQueue: tab === 'queue',
      ph: tab === 'emp' ? 'Search employers' : 'Search people or roles' };
  }
}
</script>
</body>
</html>
