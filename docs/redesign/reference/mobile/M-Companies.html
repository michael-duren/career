<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — Companies</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&family=IBM+Plex+Mono:wght@400;500&family=Architects+Daughter&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#ECEAE3}a:hover{color:#FFFFFF}
.bx{position:relative}
.bx::before{content:"";position:absolute;left:-3px;right:-3px;top:0;bottom:0;border-top:1px solid #ECEAE3;border-bottom:1px solid #ECEAE3;pointer-events:none}
.bx::after{content:"";position:absolute;top:-3px;bottom:-3px;left:0;right:0;border-left:1px solid #ECEAE3;border-right:1px solid #ECEAE3;pointer-events:none}
.dim{position:relative;height:0;border-top:1px solid rgba(236,234,227,0.6)}
.dim::before,.dim::after{content:"";position:absolute;top:-5px;height:10px;border-left:1px solid #ECEAE3;transform:skewX(-45deg)}
.dim::before{left:0}.dim::after{right:0}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:rgba(236,234,227,0.6)}
.h2{margin:0;font-weight:500;font-size:11px;letter-spacing:0.24em}
.btn{height:44px;padding:0 14px;background:transparent;border:1px solid rgba(236,234,227,0.5);color:#ECEAE3;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:0.14em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.btn.solid{background:#ECEAE3;color:#0C0C0B;border-color:#ECEAE3}
.srch{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid rgba(236,234,227,0.5);box-sizing:border-box}
.srch input{flex:1;min-width:0;border:0;background:transparent;color:#ECEAE3;font:300 14px 'Inter Tight',sans-serif;outline:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.12em;color:rgba(236,234,227,0.55)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #0C0C0B; color: #ECEAE3; font-family: 'Inter Tight', sans-serif; overflow: hidden">
  <div style="position: absolute; inset: 0 0 78px 0; overflow-y: auto; padding: 22px 22px 28px; box-sizing: border-box; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 24px"><span style="font-weight: 500; font-size: 12px; letter-spacing: 0.32em">CAREER</span><span style="display: flex; align-items: center; gap: 6px"><a href="M-Search.dc.html" aria-label="Search everything" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin: -10px 0"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 14 14" fill="none" stroke="#ECEAE3" stroke-width="1"><circle cx="6" cy="6" r="4.5"></circle><path d="M9.5 9.5 L13 13"></path></svg></a><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">5:20 PM</span></span></div>
    <div style="border-top: 1px solid rgba(236,234,227,0.3); margin-top: 12px"></div>
    <header style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 20px">
      <div style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">61 tracked</span><h1 style="margin: 0; font-weight: 200; font-size: 40px; line-height: 0.9">Companies</h1></div>
      <button type="button" class="btn solid" aria-label="Add company" style="width: 44px; padding: 0; font-size: 18px">+</button>
    </header>
    <label class="srch" style="margin-top: 16px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#ECEAE3" stroke-width="1"><circle cx="6" cy="6" r="4.5"></circle><path d="M9.5 9.5 L13 13"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search companies</span><input type="search" placeholder="Search companies"></label>
    <div role="tablist" aria-label="Priority" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid rgba(236,234,227,0.5); margin-top: 10px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
    </div>
    <div style="display: flex; flex-direction: column; margin-top: 10px">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="8">
        <div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(236,234,227,0.14)">
          <span style="width: 40px; height: 40px; border: 1px solid rgba(236,234,227,0.5); display: flex; align-items: center; justify-content: center; font-size: 13px" title="Company logo">{{c.mono}}</span>
          <a href="#" style="display: flex; flex-direction: column; gap: 4px; min-width: 0; text-decoration: none">
            <span style="display: flex; align-items: center; gap: 8px"><span style="font-weight: 300; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span><sc-if value="{{c.featured}}" hint-placeholder-val="{{false}}"><span style="font-size: 9px">◆</span></sc-if><span style="{{c.dot}}"></span></span>
            <span style="display: flex; align-items: center; gap: 8px"><span class="lbl" style="font-size: 8.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.cat}}</span><span style="display: flex; gap: 2px; align-items: flex-end; flex: none"><sc-for list="{{c.ticks}}" as="t" hint-placeholder-count="7"><span style="{{t}}"></span></sc-for></span></span>
          </a>
          <span style="display: flex; gap: 6px">
            <button type="button" aria-label="Edit {{c.title}}" style="width: 40px; height: 40px; background: transparent; border: 1px solid rgba(236,234,227,0.3); color: #ECEAE3; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1"><path d="M2 12 L2.6 9 L9.6 2 L12 4.4 L5 11.4 Z M8.4 3.2 L10.8 5.6"></path></svg></button>
            <button type="button" aria-label="Delete {{c.title}}" style="width: 40px; height: 40px; background: transparent; border: 1px solid rgba(236,234,227,0.3); color: #E0533D; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1"><path d="M2 4 H12 M5 4 V2.5 H9 V4 M3.5 4 L4.2 12.5 H9.8 L10.5 4 M6 6.5 V10.5 M8 6.5 V10.5"></path></svg></button>
          </span>
        </div>
      </sc-for>
    </div>
  </div>
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 78px; border-top: 1px solid rgba(236,234,227,0.3); background: #0C0C0B; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 16px; box-sizing: border-box">
    <a href="M-Home.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 10 L11 3 L19 10 V19 H3 Z M9 19 V13 H13 V19"></path></svg>HOME</a>
    <a href="M-Timeline.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 5 H12 M6 11 H18 M10 17 H20"></path><path d="M2 3 V7 M12 3 V7 M6 9 V13 M18 9 V13 M10 15 V19 M20 15 V19"></path></svg>TIMELINE</a>
    <a href="M-Schedule.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="4" width="16" height="15"></rect><path d="M3 9 H19 M8.3 4 V19 M13.6 4 V19"></path></svg>SCHEDULE</a>
    <a href="M-Leetgrinder.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M7 6 L2 11 L7 16 M15 6 L20 11 L15 16 M12.5 4 L9.5 18"></path></svg>LEET</a>
    <a href="M-More.dc.html" class="tab" aria-current="page" style="color: #ECEAE3; box-shadow: inset 0 1px 0 #ECEAE3"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 7 H19 M3 11 H19 M3 15 H19"></path></svg>MORE</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pr: 'all' }; }
  renderVals() {
    const C = [['TigerBeetle','Databases','high',1,0,7],['CockroachDB','Databases','high',1,0,7],['ScyllaDB','Databases','high',1,0,7],['Yugabyte','Databases','high',1,0,7],['Google','From connections','high',0,2,5],['Isovalent','Cloud-native infra','medium',1,2,7],['Stripe','From connections','medium',0,2,5],['Netflix','Big tech infra / SRE','medium',0,1,7],['ClickHouse','Databases','high',0,0,7],['Anthropic','AI infrastructure','low',0,0,7]];
    const pr = this.state.pr;
    const dot = (p) => `flex:none;width:8px;height:8px;border-radius:50%;box-sizing:border-box;border:1px solid #ECEAE3;${p === 'high' ? 'background:#ECEAE3;' : p === 'medium' ? 'background:linear-gradient(90deg,#ECEAE3 50%,transparent 50%);' : ''}`;
    const cards = C.filter((c) => pr === 'all' || c[2] === pr).map(([title, cat, p, f, done, total]) => {
      const w = title.replace(/[^A-Za-z ]/g, '').split(' ').filter(Boolean);
      return { title, cat, featured: !!f, dot: dot(p), mono: w.length > 1 ? (w[0][0] + w[1][0]).toUpperCase() : w[0].slice(0, 2),
        ticks: Array.from({ length: total }, (_, i) => `width:${i < done ? 2 : 1}px;height:9px;background:${i < done ? '#ECEAE3' : 'rgba(236,234,227,0.3)'}`) };
    });
    const tabs = [['all','ALL'],['high','HIGH'],['medium','MED'],['low','LOW']].map(([k, label]) => ({ label, sel: k === pr, pick: () => this.setState({ pr: k }),
      style: `height:40px;border:0;font:500 10px 'IBM Plex Mono',monospace;letter-spacing:0.14em;cursor:pointer;${k === pr ? 'background:#ECEAE3;color:#0C0C0B;' : 'background:transparent;color:rgba(236,234,227,0.7);'}` }));
    return { cards, tabs };
  }
}
</script>
</body>
</html>
