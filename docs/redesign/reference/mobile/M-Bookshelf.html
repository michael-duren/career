<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — Bookshelf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500&family=IBM+Plex+Mono:wght@400;500&family=Architects+Daughter&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#ECEAE3}a:hover{color:#FFFFFF}
.bx{position:relative}
.bx::before{content:"";position:absolute;left:-3px;right:-3px;top:0;bottom:0;border-top:1px solid #ECEAE3;border-bottom:1px solid #ECEAE3;pointer-events:none}
.bx::after{content:"";position:absolute;top:-3px;bottom:-3px;left:0;right:0;border-left:1px solid #ECEAE3;border-right:1px solid #ECEAE3;pointer-events:none}
.dim{position:relative;height:0;border-top:1px solid rgba(236,234,227,0.6)}
.dim::before,.dim::after{content:"";position:absolute;top:-5px;height:10px;border-left:1px solid #ECEAE3;transform:skewX(-45deg)}
.dim::before{left:0}.dim::after{right:0}
.lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:rgba(236,234,227,0.6)}
.h2{margin:0;font-weight:500;font-size:11px;letter-spacing:0.24em}
.btn{height:44px;padding:0 14px;background:transparent;border:1px solid rgba(236,234,227,0.5);color:#ECEAE3;font:500 11px 'IBM Plex Mono',monospace;letter-spacing:0.14em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.btn.solid{background:#ECEAE3;color:#0C0C0B;border-color:#ECEAE3}
.srch{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1px solid rgba(236,234,227,0.5);box-sizing:border-box}
.srch input{flex:1;min-width:0;border:0;background:transparent;color:#ECEAE3;font:300 14px 'Inter Tight',sans-serif;outline:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.12em;color:rgba(236,234,227,0.55)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #0C0C0B; color: #ECEAE3; font-family: 'Inter Tight', sans-serif; overflow: hidden">
  <div style="position: absolute; inset: 0 0 78px 0; overflow-y: auto; padding: 22px 22px 28px; box-sizing: border-box; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 24px"><span style="font-weight: 500; font-size: 12px; letter-spacing: 0.32em">CAREER</span><span style="display: flex; align-items: center; gap: 6px"><a href="M-Search.dc.html" aria-label="Search everything" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin: -10px 0"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 14 14" fill="none" stroke="#ECEAE3" stroke-width="1"><circle cx="6" cy="6" r="4.5"></circle><path d="M9.5 9.5 L13 13"></path></svg></a><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">5:20 PM</span></span></div>
    <div style="border-top: 1px solid rgba(236,234,227,0.3); margin-top: 12px"></div>
    <header style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 20px">
      <div style="display: flex; flex-direction: column; gap: 6px"><span class="lbl">32 items</span><h1 style="margin: 0; font-weight: 200; font-size: 40px; line-height: 0.9">Bookshelf</h1></div>
      <button type="button" class="btn solid" aria-label="Add item" style="width: 44px; padding: 0; font-size: 18px">+</button>
    </header>
    <label class="srch" style="margin-top: 16px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#ECEAE3" stroke-width="1"><circle cx="6" cy="6" r="4.5"></circle><path d="M9.5 9.5 L13 13"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search title or author</span><input type="search" placeholder="Search title or author"></label>
    <span class="lbl" style="margin-top: 22px">In progress</span>
    <a href="#" class="bx" style="margin: 10px 3px 0; padding: 14px 16px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; text-decoration: none">
      <svg aria-hidden="true" width="44" height="58" viewBox="0 0 44 58" fill="none" stroke="#ECEAE3" stroke-width="1"><rect x="1" y="1" width="42" height="56"></rect><path d="M6 1 V57"></path><path d="M12 16 H38 M12 22 H32" stroke-opacity="0.5"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <span style="font-weight: 300; font-size: 17px; line-height: 1.2">Beej's Guide to Network Programming</span>
        <span style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px"><sc-for list="{{ch}}" as="c" hint-placeholder-count="10"><span style="{{c}}"></span></sc-for></span>
        <span style="display: flex; justify-content: space-between"><span class="lbl" style="font-size: 9px">4 / 10 chapters</span><span class="lbl" style="font-size: 9px">Sep 24</span></span>
      </span>
    </a>
    <div style="display: flex; gap: 8px; overflow-x: auto; margin-top: 22px; padding-bottom: 4px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6"><button type="button" style="{{c.style}}">{{c.name}}</button></sc-for>
    </div>
    <div style="display: flex; flex-direction: column; margin-top: 8px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
        <a href="#" style="display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 58px; border-bottom: 1px solid rgba(236,234,227,0.12); text-decoration: none">
          <span>{{r.icon}}</span>
          <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 300; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="font-size: 12px; opacity: 0.6">{{r.author}}</span></span>
          <span class="lbl" style="font-size: 8.5px">{{r.pri}}</span>
        </a>
      </sc-for>
    </div>
  </div>
  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 78px; border-top: 1px solid rgba(236,234,227,0.3); background: #0C0C0B; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 16px; box-sizing: border-box">
    <a href="M-Home.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 10 L11 3 L19 10 V19 H3 Z M9 19 V13 H13 V19"></path></svg>HOME</a>
    <a href="M-Timeline.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 5 H12 M6 11 H18 M10 17 H20"></path><path d="M2 3 V7 M12 3 V7 M6 9 V13 M18 9 V13 M10 15 V19 M20 15 V19"></path></svg>TIMELINE</a>
    <a href="M-Schedule.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="4" width="16" height="15"></rect><path d="M3 9 H19 M8.3 4 V19 M13.6 4 V19"></path></svg>SCHEDULE</a>
    <a href="M-Leetgrinder.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M7 6 L2 11 L7 16 M15 6 L20 11 L15 16 M12.5 4 L9.5 18"></path></svg>LEET</a>
    <a href="M-More.dc.html" class="tab" aria-current="page" style="color: #ECEAE3; box-shadow: inset 0 1px 0 #ECEAE3"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 7 H19 M3 11 H19 M3 15 H19"></path></svg>MORE</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const hatch = 'repeating-linear-gradient(-45deg,#ECEAE3 0 0.8px,transparent 0.8px 4px)';
    const ch = Array.from({ length: 10 }, (_, i) => `height:10px;box-sizing:border-box;border:1px solid ${i < 4 ? '#ECEAE3' : 'rgba(236,234,227,0.3)'};${i < 4 ? `background:${hatch};` : ''}`);
    const cats = ['All','Career','Computer Science','Distributed Systems','OS','Networking'].map((name, i) => ({ name, style: `flex:none;height:36px;padding:0 12px;border:1px solid ${i === 0 ? '#ECEAE3' : 'rgba(236,234,227,0.35)'};background:${i === 0 ? '#ECEAE3' : 'transparent'};color:${i === 0 ? '#0C0C0B' : '#ECEAE3'};font:500 10px 'IBM Plex Mono',monospace;letter-spacing:0.1em;text-transform:uppercase` }));
    const ICON = { book: '▯', paper: '▤', course: '▷' };
    const rows = [['Designing Data-Intensive Applications','Kleppmann, Riccomini','book','high'],['Database Internals','Alex Petrov','book','high'],['System Design Interview — Vol. 1','Alex Xu','book','high'],['Introduction to Algorithms (CLRS)','Cormen et al.','book','medium'],['Staff Engineer','Will Larson','book','medium'],['MapReduce','Dean, Ghemawat','paper','medium'],['Learn Cryptography in Go','Boot.dev','course','low']].map(([title, author, t, pri]) => ({ title, author, pri, icon: ICON[t] }));
    return { ch, cats, rows };
  }
}
</script>
</body>
</html>
