apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: career
  namespace: career-strategy
spec:
  ingressClassName: traefik
  rules:
    - host: career.homelab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: career
                port: {number: 80}

