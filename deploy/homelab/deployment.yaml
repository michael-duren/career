apiVersion: apps/v1
kind: Deployment
metadata:
  name: career
  namespace: career-strategy
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: career}
  template:
    metadata:
      labels: {app: career}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: career
          image: career-strategy:RELEASE
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: career-config}
            - secretRef: {name: career-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

