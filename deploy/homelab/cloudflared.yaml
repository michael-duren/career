# Render only through the tunnel phase, using a reviewed digest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: career-tunnel
  namespace: career-strategy
spec:
  replicas: 2
  selector:
    matchLabels: {app: career-tunnel}
  template:
    metadata:
      labels: {app: career-tunnel}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: CLOUDFLARED_IMAGE
          args: [tunnel, --no-autoupdate, run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: career-tunnel, key: TUNNEL_TOKEN}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}

