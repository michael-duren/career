# Dedicated local development database; never points at homelab/production.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: career_dev
      POSTGRES_USER: career_dev
      POSTGRES_PASSWORD: career_dev_local
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5433}:5432"
    volumes:
      - career_postgres17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_dev -d career_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  career_postgres17:
